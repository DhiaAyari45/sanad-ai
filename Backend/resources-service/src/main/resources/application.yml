server:
  port: 8084

spring:
  application:
    name: resources-service
  config:
    # Le Config Server (Backend/Infrastructure) surcharge ces valeurs lorsqu'il est disponible.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/sanad_resources
    username: ${DB_USER:sanad_resources}
    password: ${DB_PASSWORD:sanad_resources_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: resources-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/sanad}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
